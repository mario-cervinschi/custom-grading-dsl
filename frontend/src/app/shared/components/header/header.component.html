<header
  class="flex items-center justify-between h-14 px-6 bg-[#1a1a1a] border-b border-[#2d2d2d] text-white"
>
  <h1 class="text-xl font-bold tracking-tight">Editor</h1>

  <nav class="flex items-center gap-2">
    <button (click)="toggleTheme()" class="px-3 py-1 text-sm border border-[#525252] rounded-md hover:bg-[#404040] transition-all cursor-pointer">
      {{ isLight ? '🌙' : '☀️' }}
    </button>
  </nav>
</header>
